# 지면 캘리브레이션 마커 (python3 -m camreal calibrate). data/calibration/markers.yaml로 복사해서 실측값으로 고칠 것
# 원점: 후륜축 중심의 바닥 투영점. x 전방, y 좌측(오른쪽은 -), 단위 m
# 1. 주차 칸: 차가 늘 같은 자세로 서게 네 바퀴 바깥쪽 바닥에 테이프를 붙임
# 2. 후륜축 선: 좌우 뒷바퀴 축 바로 아래를 잇는 선을 테이프로 표시. 그 선의 가운데가 원점
# 3. 마커: 아래 위치 근처에 십자 테이프를 붙이고 원점에서 십자 중심까지 줄자로 잼
#    x는 후륜축 선에서 앞쪽 거리, y는 차 중심선에서 왼쪽 거리
#    카메라 화면에 안 들어오는 마커는 보이는 곳으로 옮기거나 지움 (6개 이상, 같은 좌표 금지)
markers:
  A1: [0.60, 0.40]    # A~D줄: 가까운 줄부터, 1~3열: 왼쪽부터
  A2: [0.60, 0.00]
  A3: [0.60, -0.40]
  B1: [1.00, 0.40]
  B2: [1.00, 0.00]
  B3: [1.00, -0.40]
  C1: [1.50, 0.40]
  C2: [1.50, 0.00]
  C3: [1.50, -0.40]
  D1: [2.00, 0.40]
  D2: [2.00, 0.00]
  D3: [2.00, -0.40]

<!doctype html><html lang="ko"><meta charset="utf-8"><title>Camreal 지면 캘리브레이션</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#121722;color:#edf1f8;font:15px system-ui,sans-serif}header{padding:14px 24px;background:#1d2635;display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}h1{font-size:20px;margin:0}header span{color:#bac7da;font-size:14px;overflow-wrap:anywhere}main{padding:16px 24px}button{font:inherit;border:1px solid #526078;background:#263348;color:#fff;padding:8px 12px;border-radius:5px;cursor:pointer}button:hover:enabled{background:#3b506d}button:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.pane{background:#1d2635;padding:16px;border-radius:8px}h2{font-size:16px;margin:0 0 12px}canvas{display:block;max-width:100%;max-height:74vh;width:auto;height:auto;touch-action:none;cursor:crosshair;background:#242a35}p{line-height:1.6;color:#bac7da}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:5px 6px;text-align:left;border-bottom:1px solid #2c374b}th{color:#bac7da;font-weight:normal}#list tr{cursor:pointer}#list tr:hover{background:#263348}#list tr.selected{background:#3b4a66;box-shadow:inset 3px 0 #ffb454}.num{text-align:right}.placed{color:#85d9b9}.skipped,.na{color:#8894a8}.good{color:#5fd68f}.warn{color:#ffc76b}.bad{color:#ff7a85}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;margin-top:20px}#bev{display:block;max-width:100%;max-height:60vh}#rms{font-size:18px;color:#edf1f8;margin:0}#pose{display:grid;grid-template-columns:repeat(2,max-content max-content);gap:4px 18px;margin:12px 0 16px}#pose span{color:#bac7da}#pose b{font-weight:600;font-variant-numeric:tabular-nums}.pending #list,.pending .result{opacity:.6}.save{background:#246b54}#status{white-space:pre-wrap;min-height:24px}#status.ok{color:#85d9b9}#status.problem{color:#ffc76b}#status.error{color:#ff7a85}kbd{border:1px solid #526078;border-radius:4px;padding:0 5px;background:#263348}@media(max-width:900px){.layout,.result{grid-template-columns:1fr}}
</style>
<header><h1>Camreal 지면 캘리브레이션</h1><span id="ost"></span><span id="size"></span><span id="frame"></span><span id="out"></span></header>
<main><div class="layout"><section class="pane"><h2 id="hint">왜곡 보정 영상</h2><canvas id="canvas" aria-label="왜곡 보정 영상"></canvas>
<p>목록에서 고른 마커의 십자 중심을 클릭하면 찍히고 다음 미작업 마커로 넘어갑니다. 찍은 점은 드래그로 옮기고 <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd>로 1 px씩 움직입니다. 커서 옆 돋보기는 원본 해상도의 4배입니다.</p></section>
<section class="pane"><h2>마커 (후륜축 중심 기준 m, x 전방 · y 왼쪽)</h2>
<table><thead><tr><th>id</th><th class="num">x</th><th class="num">y</th><th>상태</th><th class="num">오차</th></tr></thead><tbody id="list"></tbody></table>
<div class="tools"><button id="skip">건너뛰기 <kbd>S</kbd></button><button id="clear">지우기 <kbd>Del</kbd></button></div>
<p id="legend">오차: 그 마커를 빼고 맞춘 H가 예측한 위치와 줄자로 잰 위치의 거리.</p></section></div>
<section class="pane result"><div><h2>BEV 미리보기</h2><img id="bev" alt="찍은 점으로 만든 BEV 미리보기" hidden><p id="bevNote"></p></div>
<div><h2>결과</h2><p id="rms"></p><div id="pose"></div><button id="save" class="save" disabled>저장</button><p id="status" role="status"></p></div></section></main>
<script src="/app.js"></script></html>
